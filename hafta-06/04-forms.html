    <meta charset="UTF-8" />

    <title>Hafta 06 - Kapsamlı Form Girişleri ve HTTP POST</title>
  </head>
  <body
    style="
      font-family: sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    "
  >
    <nav>
      <a href="03-audio.html">← Önceki: Ses</a> |
      <a
        href="https://github.com/Meglore/web-tasarimi-ders-notlari/blob/main/hafta-06/README.md"
        >Hafta 06 Menü</a
      >
      |
      <a href="05-seo-tags.html">Sonraki: Semantik Düzen →</a>

    <h2>Kullanıcı Kayıt ve Profil Formu</h2>
    <p>
      <small
        >* Form gönderildiğinde <code>action</code> dosyasında HTTP
        <code>POST</code> gövdesi (Payload) incelenmelidir.</small
      >
    </p>

    <!-- 
      Form Parametreleri:
      - action: Verinin POST edileceği hedef betik / URL.
      - method: "POST" (Veriyi Request Body içinde gizli taşır) veya "GET" (URL query parametresi olarak taşır).
      - enctype: Dosya yükleme yapılıyorsa multipart/form-data olmak zorundadır.
    -->
    <form action="kayit-islem.php" method="POST" enctype="multipart/form-data">
      <!-- ================= 1. METİN KUTULARI VE ŞİFRE ================= -->
      <label for="ad">Adınız:</label><br />
      <input
        type="text"
        id="ad"
        name="kullanici_adi"
        placeholder="Adınızı giriniz..."
        required
      /><br /><br />

      <label for="soyad">Soyadınız:</label><br />
      <input
        type="text"
        id="soyad"
        name="kullanici_soyad"
        placeholder="Soyadınızı giriniz..."
        required
      /><br /><br />

      <label for="email">E-posta Adresi:</label><br />
      <input
        type="email"
        id="email"
        name="kullanici_email"
        placeholder="ornek@atauni.edu.tr"
        required
      /><br /><br />

      <label for="sifre">Şifre:</label><br />
      <!-- type="password": Karakterleri ekranda maskeler ancak arkada düz metin olarak sunucuya yollar -->
      <input
        type="password"
        id="sifre"
        name="kullanici_sifre"
        required
      /><br /><br />

      <hr />

      <!-- ================= 2. SAYISAL VE TARİH GİRİŞLERİ ================= -->
      <label for="yas">Yaşınız:</label><br />
      <!-- min ve max nitelikleri ile istemci tarafında sayısal sınırlandırma -->
      <input
        type="number"
        id="yas"
        name="kullanici_yas"
        min="18"
        max="99"
        value="20"
      /><br /><br />

      <label for="dogum">Doğum Tarihi:</label><br />
      <!-- type="date": Tarayıcının yerel tarih takvimini açar -->
      <input type="date" id="dogum" name="dogum_tarihi" /><br /><br />

      <hr />

      <!-- ================= 3. RENK SEÇİMİ ================= -->
      <label for="favori-renk">Favori Profil Renginiz:</label><br />
      <!-- type="color": Hex kodunu (#3498db) renk paletinden seçtirir -->
      <input
        type="color"
        id="favori-renk"
        name="kullanici_rengi"
        value="#3498db"
      /><br /><br />

      <hr />

      <!-- ================= 4. SEÇİM ELEMANLARI (RADIO & CHECKBOX) ================= -->
      <label>Cinsiyet (Yalnızca Tek Seçim):</label><br />
      <!-- Ortak 'name' alanı sayesinde sadece biri seçilebilir -->
      <input type="radio" id="erkek" name="cinsiyet" value="Erkek" />
      <label for="erkek">Erkek</label>
      <input type="radio" id="kadin" name="cinsiyet" value="Kadın" />
      <label for="kadin">Kadın</label><br /><br />

      <label>İlgi Alanlarınız (Çoklu Seçim):</label><br />
      <input type="checkbox" id="hobi1" name="hobiler[]" value="Yazilim" />
      <label for="hobi1">Yazılım</label>
      <input type="checkbox" id="hobi2" name="hobiler[]" value="Spor" />
      <label for="hobi2">Spor</label>
      <input type="checkbox" id="hobi3" name="hobiler[]" value="Muzik" />
      <label for="hobi3">Müzik</label><br /><br />

      <input
        type="checkbox"
        id="fenerbahceli"
        name="fenerbahceli"
        value="Evet"
      />
      <label for="fenerbahceli">Fenerbahçeli misiniz?</label><br /><br />

      <hr />

      <!-- ================= 5. DOSYA YÜKLEME ================= -->
      <label for="profil-resmi">Profil Fotoğrafı Yükle:</label><br />
      <!-- accept: Kullanıcının sadece belirli dosya türlerini seçmesine izin verir -->
      <input
        type="file"
        id="profil-resmi"
        name="profil_dosyasi"
        accept=".jpg,.jpeg,.png"
      /><br /><br />

      <hr />

      <!-- ================= 6. AÇILIR LİSTE (SELECT) VE TEXTAREA ================= -->
      <label for="sehir">Yaşadığınız Şehir:</label><br />
      <select id="sehir" name="sehir" required>
        <option value="" disabled selected>Şehir seçiniz...</option>
        <option value="erzurum">Erzurum</option>
        <option value="istanbul">İstanbul</option>
        <option value="ankara">Ankara</option>
        <option value="izmir">İzmir</option></select
      ><br /><br />

      <label for="mesaj">Hakkınızda / Mesajınız:</label><br />
      <textarea
        id="mesaj"
        name="kullanici_mesaj"
        rows="4"
        cols="40"
        placeholder="Kendinizden bahsedin..."
      ></textarea
      ><br /><br />

      <hr />

      <!-- ================= 7. SUBMIT VE RESET BUTONLARI ================= -->
      <button
        type="submit"
        style="
          background-color: #2563eb;
          color: white;
          padding: 8px 16px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Kayıt Ol (POST Et)
      </button>
      <button
        type="reset"
        style="
          background-color: #ef4444;
          color: white;
          padding: 8px 16px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Formu Temizle
      </button>
    </form>
  </body>
</html>
