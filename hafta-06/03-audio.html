    <h1>HTML5 Yerel Ses Oynatıcı (`<audio>`)</h1>
    <p>Aşağıda döngüsel oynatma (`loop`) ve standart kontrollerle yapılandırılmış ses örneği yer almaktadır:</p>

    <!-- 
      audio etiketi nitelikleri:
      - controls: Oynat, duraklat, ses ayarı ve zaman çubuğunun görünmesini sağlar (olmazsa ses denetlenemez).
      - loop: Ses bittiğinde başa dönüp tekrar çalmaya devam eder.
      - autoplay: Sayfa yüklendiğinde otomatik başlatır.
      - muted: Sesi kapalı olarak başlatır.
    -->
    <audio controls loop style="margin-top: 20px;">
        <!-- 
          MIME türleri: MP3 için audio/mpeg, OGG için audio/ogg, WAV için audio/wav kullanılır.
        -->
        <source src="muzik-dosyasi.mp3" type="audio/mpeg">
        <source src="muzik-dosyasi.ogg" type="audio/ogg">

        Tarayıcınız HTML5 ses etiketini desteklememektedir.
    </audio>
</body>
