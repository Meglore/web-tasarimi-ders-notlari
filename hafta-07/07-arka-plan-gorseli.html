<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hafta 07 · CSS Arka Plan Görseli</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }

      .ornek {
        min-height: 200px;
        background-color: #e2e8f0;
        background-image: url("https://i.hizliresim.com/rwludxz7.jpg");
        background-size: 110px auto;
      }

      .tek-gorsel {
        background-repeat: no-repeat;
        background-position: center;
      }
      .kaplayan-gorsel {
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Arka plan görselini yerleştirmek</h1>

      <h2>Varsayılan tekrar</h2>
      <div class="ornek"></div>

      <h2>Tek görsel, ortalanmış</h2>
      <div class="ornek tek-gorsel"></div>
      <h2>Alanı kaplayan görsel</h2>
      <div class="ornek tek-gorsel kaplayan-gorsel"></div>
    </main>
  </body>
</html>
