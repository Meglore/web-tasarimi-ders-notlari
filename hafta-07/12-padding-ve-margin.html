<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hafta 07 · Padding ve Margin</title>
    <style>
      .cerceve {
        border: 1px dashed #475569;
        background-color: #f1f5f9;
      }

      .kutu {
        padding: 30px;
        margin-left: 50px;
        border: 2px solid #1d4ed8;
        background-color: #dbeafe;
      }

      .icerik {
        background-color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>İç boşluk ve dış boşluk</h1>
      <div class="cerceve">
        <div class="kutu">
          <div class="icerik">İçerik alanı</div>
        </div>
      </div>
      <p>Mavi kutunun içinde 30 px, sol kenarının dışında 50 px boşluk var.</p>
    </main>
  </body>
</html>
