<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hafta 07 · CSS Kenarlıkları</title>
    <style>
      .ornek {
        margin-block: 12px;
        padding: 12px;
      }

      .ayri-ozellikler {
        border-width: 4px;
        border-style: dotted;
        border-color: brown;
      }

      .kisa-yazim {
        border: 10px solid brown;
      }

      .tek-kenar {
        border-left: 10px solid brown;
      }
      .yuvarlatilmis {
        width: 200px;
        height: 200px;
        border: 5px solid red;
        border-radius: 30px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kutunun sınırlarını göstermek</h1>
      <p class="ornek ayri-ozellikler">Kalınlık, çizgi biçimi ve renk ayrı ayrı yazıldı.</p>
      <p class="ornek kisa-yazim">Aynı üç özellik tek bildirimde yazıldı.</p>
      <p class="ornek tek-kenar">Çizgi yalnızca sol kenara uygulandı.</p>
      <div class="ornek yuvarlatilmis">Köşeler border-radius ile yuvarlatıldı.</div>
    </main>
  </body>
</html>
